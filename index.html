<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HQMC ON-LINE CV SYSTEM — KEONI KIM</title>
    <meta
      name="description"
      content="A green-screen, IBM 3270 / CICS-style CV and portfolio template for Keoni Kim — federal IT systems administrator and data analyst."
    />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23020a05'/><path d='M6 8h20M6 14h14M6 20h20M6 26h10' stroke='%2333ff66' stroke-width='2' stroke-linecap='square'/></svg>"
    />
  </head>
  <body class="theme-green" data-theme="green">
    <!--
      ============================================================
      HQMC ON-LINE CV SYSTEM (KKIMCV1)
      Static IBM 3270 / CICS-style CV template
      ------------------------------------------------------------
      EDITING TIPS:
        * All screen content lives in app.js -> SCREENS object.
          Edit text, fields, and option targets there.
        * To add a new screen: add an entry to SCREENS keyed by
          its transaction id (TRANID) and reference it from
          another screen's options or commands.
        * Themes:  ?theme=green | amber | white  (or buttons in footer)
        * BMS-like attributes are conveyed via CSS classes:
            .bms-prot       protected (read-only label)
            .bms-unprot     unprotected (user input)
            .bms-bright     high-intensity / bright
            .bms-dim        normal/dim
            .bms-rev        reverse video (selected)
            .bms-num        numeric-only
            .bms-mdt        modified data tag (changed since render)
            .bms-err        error highlight
      ============================================================
    -->

    <a class="skip-link" href="#screen-region">Skip to screen content</a>

    <main class="terminal" role="main" aria-label="3270 terminal emulator">
      <div class="bezel">
        <div class="crt" aria-hidden="false">
          <div class="scanlines" aria-hidden="true"></div>
          <div class="vignette" aria-hidden="true"></div>
          <div class="flicker" aria-hidden="true"></div>

          <!-- Top status / banner row (row 1) -->
          <header class="row row-banner" role="banner">
            <span class="bms-prot bms-bright" aria-label="System">HQMC-CV</span>
            <span class="bms-prot" id="banner-tranid" aria-label="Transaction id">TRAN: KKM1</span>
            <span class="bms-prot" id="banner-title" aria-live="polite">ON-LINE CV SYSTEM</span>
            <span class="bms-prot" id="banner-date">DATE: ----/--/--</span>
            <span class="bms-prot" id="banner-time" aria-live="off">TIME: --:--:--</span>
          </header>

          <!-- Screen region (rows 2..22) -->
          <section
            id="screen-region"
            class="screen"
            role="region"
            aria-label="Screen content"
            aria-live="polite"
            tabindex="-1"
          ></section>

          <!-- Command line (row 23) -->
          <form class="row row-cmd" id="cmd-form" autocomplete="off" novalidate>
            <label for="cmd-input" class="bms-prot bms-bright cmd-prompt" aria-label="Command">
              ===&gt;
            </label>
            <input
              id="cmd-input"
              class="bms-unprot bms-bright cmd-input"
              name="cmd"
              type="text"
              spellcheck="false"
              autocapitalize="characters"
              inputmode="text"
              maxlength="64"
              aria-describedby="status-line"
            />
          </form>

          <!-- Status / message line + PF key footer (row 24) -->
          <footer class="row row-status" role="contentinfo">
            <span id="status-line" class="bms-prot status" aria-live="polite">
              READY. ENTER OPTION OR COMMAND.
            </span>
          </footer>

          <nav class="row row-pf" aria-label="Program function keys">
            <button type="button" class="pf" data-pf="1">F1=Help</button>
            <button type="button" class="pf" data-pf="3">F3=Exit</button>
            <button type="button" class="pf" data-pf="7">F7=Up</button>
            <button type="button" class="pf" data-pf="8">F8=Down</button>
            <button type="button" class="pf" data-pf="12">F12=Return</button>
            <button type="button" class="pf pf-theme" data-theme-cycle>THEME</button>
          </nav>
        </div>
      </div>
    </main>

    <!-- Inline SVG mark used as a logo on the LOGON / WELCOME screen -->
    <template id="svg-logo">
      <svg
        class="logo"
        viewBox="0 0 240 60"
        role="img"
        aria-label="HQMC On-Line CV System logo"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
      >
        <!-- Terminal frame -->
        <rect x="2" y="2" width="74" height="56" rx="4" stroke="currentColor" stroke-width="2" />
        <!-- Cursor block -->
        <rect x="10" y="42" width="8" height="10" fill="currentColor" />
        <!-- Scanlines as text rows -->
        <path
          d="M10 14h58 M10 22h44 M10 30h58 M10 38h36"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="square"
        />
        <!-- Wordmark -->
        <text
          x="88"
          y="30"
          font-family="ui-monospace, Menlo, Consolas, monospace"
          font-size="18"
          font-weight="700"
          letter-spacing="2"
          fill="currentColor"
        >
          HQMC-CV
        </text>
        <text
          x="88"
          y="48"
          font-family="ui-monospace, Menlo, Consolas, monospace"
          font-size="9"
          letter-spacing="2"
          fill="currentColor"
        >
          ON-LINE / 3270
        </text>
      </svg>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
